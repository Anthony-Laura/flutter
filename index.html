<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f2" />
    <meta
      name="description"
      content="Descarga Water Eject desde su publicación oficial de GitHub."
    />
    <title>Water Eject — Descarga</title>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">W</div>
        <p class="eyebrow">WATER EJECT</p>
        <h1 id="page-title">Lleva la app a tu Android</h1>
        <p class="intro">
          Escanea el código QR con tu teléfono para abrir la descarga oficial
          de Water Eject.
        </p>

        <div class="qr-frame" id="qr-frame" hidden>
          <canvas id="qr-code" aria-label="Código QR para descargar Water Eject"></canvas>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <a id="download-link" class="button" hidden>Descargar APK</a>
        <button id="save-qr" class="button button-secondary" type="button" hidden>
          Guardar código QR
        </button>
        <p class="note">
          Android puede pedir permiso para instalar aplicaciones descargadas
          desde el navegador.
        </p>
      </section>
      <footer>Distribución oficial de Water Eject</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
